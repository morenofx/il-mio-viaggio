<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Il mio viaggio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213D">
<meta name="robots" content="noindex, nofollow">
<title>Il mio viaggio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F5; --card:#FFFFFF; --ink:#14213D; --soft:#4A5670; --line:#D5DDE0;
  --gold:#F2A900; --goldbg:#FFF4D1; --jade:#1F7A63; --jadebg:#E3F3EE;
  --red:#B3261E; --redbg:#FBE7E5; --navy:#14213D; --onnavy:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --card:#18233A; --ink:#F1F4F8; --soft:#AEB9CC; --line:#2C3A56;
    --goldbg:#3A2F10; --jadebg:#12342C; --redbg:#3D1614; --navy:#22345A; --jade:#4CC3A2; --red:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#18233A; --ink:#F1F4F8; --soft:#AEB9CC; --line:#2C3A56;
  --goldbg:#3A2F10; --jadebg:#12342C; --redbg:#3D1614; --navy:#22345A; --jade:#4CC3A2; --red:#FF8A80;
}
html{height:100%}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:20px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px}
h2{font-size:24px;margin:28px 0 10px}
p{margin:6px 0}
.sub{color:var(--soft);font-size:18px}
.panel{display:none}.panel.on{display:block}

.hero{background:var(--navy);color:var(--onnavy);border-radius:20px;padding:22px 20px;margin:12px 0 8px}
.hero .when{font-size:18px;opacity:.85}
.hero .what{font-size:28px;font-weight:700;line-height:1.2;margin:6px 0}
.hero .count{display:inline-block;background:var(--gold);color:#14213D;font-weight:700;border-radius:999px;padding:6px 16px;margin-top:8px;font-size:20px}
.hero .note{font-size:18px;margin-top:10px;opacity:.9}
.hero .small{font-size:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.tip{background:var(--goldbg);border-color:var(--gold)}
.hotel{background:var(--jadebg);border-color:var(--jade)}
.hotel .name{font-size:24px;font-weight:700;color:var(--jade)}
.alert{background:var(--redbg);border:2px solid var(--red);border-radius:14px;padding:14px 16px;margin:10px 0}
.alert b{color:var(--red)}
.alert .btn{margin-bottom:0}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 22px 58px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;
  background:var(--navy);color:var(--onnavy);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:21px}
.steps li::after{content:"";position:absolute;left:20px;top:46px;bottom:4px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps b.t{display:block;font-size:22px}

.flight{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.flight:last-child{border-bottom:0}
.route{font-size:23px;font-weight:700}
.fno{color:var(--soft);font-size:18px;text-align:right;align-self:center}
.ftime{grid-column:1/-1;font-size:19px}
.track{grid-column:1/-1;font-size:18px;font-weight:700;color:var(--jade);margin-top:4px}

.btn{display:block;width:100%;text-align:center;font:inherit;font-weight:700;font-size:21px;
  padding:16px;border-radius:14px;border:0;margin:10px 0;text-decoration:none;cursor:pointer}
.btn.main{background:var(--gold);color:#14213D}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{font-size:17px;padding:10px;margin:6px 0}
.btn:disabled{opacity:.5}
a{color:inherit}
.tel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.tel:last-child{border-bottom:0}
.tel strong{font-size:24px;color:var(--jade);white-space:nowrap}
.phr{padding:10px 0;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr b{font-size:23px;display:block}

.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.day{margin:22px 0 6px;font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day .today{background:var(--gold);color:#14213D;font-size:16px;border-radius:999px;padding:3px 12px}
.ph{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.ph input{width:30px;height:30px;flex:none;margin-top:2px;accent-color:var(--jade)}
.ph .tm{display:block;font-weight:700;color:var(--jade);font-size:19px}
.ph.imp{border:2px solid var(--red)}
.ph.imp .tm{color:var(--red)}
.ph.done{opacity:.55}
.ph.done .tx{text-decoration:line-through}
.ph a{font-weight:700}

.conv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conv label{font-size:17px;color:var(--soft)}
.conv input{display:block;width:100%;font:inherit;font-size:26px;font-weight:700;padding:10px 12px;margin-top:4px;
  border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.rate{font-size:17px;color:var(--soft);margin-top:10px}
.rate input{width:90px;font:inherit;font-size:18px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}

/* form */
.fl{display:block;font-weight:700;margin:18px 0 6px}
.fl .sub{font-weight:400;display:block}
textarea,.in{display:block;width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:170px;resize:vertical}
.files{font-size:17px;color:var(--soft);margin-top:6px}
.status{margin:12px 0;font-size:19px;min-height:1em}
.status.err{color:var(--red);font-weight:700}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--jade);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.trip{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip .nm{flex:1}
.trip .nm b{display:block}
.trip .act{background:var(--gold);color:#14213D;font-size:15px;font-weight:700;border-radius:999px;padding:3px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:30px 10px}
.empty .big{font-size:60px}
.ver{font-size:16px;color:var(--soft);text-align:center;margin-top:4px}

/* prenotazioni salvate nel telefono */
.dochint{font-size:16px;color:var(--soft);margin:-2px 0 8px}
#docv{position:fixed;inset:0;background:#fff;z-index:11;display:none;flex-direction:column}
#docv.on{display:flex}
#docv .bar2{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#14213D;color:#fff}
#docv .bar2 b{flex:1;font-size:18px;line-height:1.2}
#docv .bar2 button{background:#F2A900;color:#14213D;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:17px;padding:8px 14px;cursor:pointer}
#docv .body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
#docv .body img{display:block;width:100%;height:auto}
#docv .body iframe{display:block;width:100%;height:100%;border:0}
#docv .foot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#F3F6F5}
#docv .foot a,#docv .foot button{flex:1;text-align:center;font:inherit;font-size:16px;font-weight:700;padding:10px;border-radius:10px;border:2px solid #D5DDE0;background:#fff;color:#14213D;text-decoration:none;cursor:pointer}

/* cartelli dell'aeroporto: le parole da cercare */
.signs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px}
.sign{background:#1B1B1B;color:#FFD200;font-weight:700;font-size:17px;letter-spacing:.3px;border-radius:6px;padding:5px 10px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.photos{font-size:16px;font-weight:700;color:var(--jade);margin-left:4px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:0;font:inherit;font-size:13px;color:var(--soft);padding:10px 2px 12px;cursor:pointer}
nav button .ic{display:block;font-size:24px;line-height:1.2}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#upd{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;max-width:616px;margin:0 auto;
  background:var(--jade);color:#fff;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-size:19px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;display:none}
#upd.on{display:block}

#driver{position:fixed;inset:0;background:#FFFFFF;color:#000;z-index:10;display:none;flex-direction:column;overflow:auto;
  justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
#driver.on{display:flex}
#driver .lbl{font-size:22px;color:#555}
#driver .dn{font-size:40px;font-weight:700;line-height:1.1;margin:10px 0 16px}
#driver .da{font-size:28px;line-height:1.3}
#driver .th{font-size:28px;line-height:1.4;margin-top:22px;padding-top:18px;border-top:2px solid #ddd}
#driver .th .lbl{font-size:20px}
#driver button{margin-top:28px;background:#14213D;color:#fff}
</style>
</head>
<body>
<main id="app"></main>

<nav aria-label="Sezioni"><div class="in">
  <button class="on" data-p="oggi"><span class="ic">✈️</span>Oggi</button>
  <button data-p="fasi"><span class="ic">✅</span>Fasi</button>
  <button data-p="viaggio"><span class="ic">🏨</span>Voli e hotel</button>
  <button data-p="utili"><span class="ic">☎️</span>Utili</button>
  <button data-p="viaggi"><span class="ic">🧳</span>Viaggi</button>
</div></nav>

<button id="upd">C'è una versione nuova · tocca per aggiornare</button>

<div id="docv" role="dialog" aria-modal="true" aria-label="Prenotazione">

  <div class="foot"><a id="docopen" target="_blank" rel="noopener">Apri grande</a><button id="docrm">Togli</button></div>
</div>

  <button class="btn" id="dclose">Chiudi</button>
</div>

function load(k,def){try{var v=localStorage.getItem(k);return v===null?def:JSON.parse(v)}catch(e){return def}}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=String(u||'');return /^https:\/\//i.test(u)?u:''}
function telOf(n){return String(n||'').replace(/[^\d+]/g,'')}

/* ---------- orari: ogni ora e' nel fuso del posto ---------- */
function tzOffset(ms,tz){
  try{
    var p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})
      .formatToParts(new Date(ms)).forEach(function(x){p[x.type]=x.value});
    return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(ms/1000)*1000;
  }catch(e){return 0}
}
// "2026-10-03T22:50" nel fuso tz -> millisecondi
function z2e(s,tz){
  var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(!m)return NaN;
  var g=Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  var t=g-tzOffset(g,tz);
  return g-tzOffset(t,tz);
}
function fmtF(ms,tz,o){try{return new Intl.DateTimeFormat('it-IT',Object.assign({timeZone:tz},o)).format(new Date(ms))}catch(e){return ''}}
function hm(ms,tz){return fmtF(ms,tz,{hour:'2-digit',minute:'2-digit'})}
function dayLong(ms,tz){return fmtF(ms,tz,{weekday:'long',day:'numeric',month:'long'})}
function dayShort(ms,tz){return fmtF(ms,tz,{weekday:'short',day:'numeric',month:'short'})}
function ymd(ms,tz){var p={};try{new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ms)).forEach(function(x){p[x.type]=x.value})}catch(e){}return p.year+'-'+p.month+'-'+p.day}
function dur(min){min=Math.round(min);var h=Math.floor(min/60),m=min%60;return h?(h+(h===1?' ora':' ore')+(m?' e '+m+' min':'')):(m+' min')}

     checkin:'2026-10-04',checkin_time:'14:00',checkout:'2026-10-07',checkout_time:'12:00',notes:'Deluxe Chill Room, non rimborsabile',phone:'+66 2 615 0999'},

/* ---------- dal viaggio alle fasi (regole fisse, non decise dall'AI) ---------- */
function build(T){
  var ap=T.airports||{};
  function tz(c){return (ap[c]&&ap[c].tz)||T.dest_tz||'UTC'}
  function city(c){return (ap[c]&&ap[c].city)||c}
  var F=(T.flights||[]).map(function(f){return Object.assign({},f,{depT:z2e(f.dep,tz(f.from)),arrT:z2e(f.arr,tz(f.to))})})
    .filter(function(f){return !isNaN(f.depT)}).sort(function(a,b){return a.depT-b.depT});
  // voli attaccati (meno di 24 ore di scalo) = un solo spostamento
  var J=[];F.forEach(function(f,i){if(i===0||f.depT-F[i-1].arrT>24*36e5||f.leg!==F[i-1].leg)J.push([]);J[J.length-1].push(f)});
  var dtz=T.dest_tz||(J[0]?tz(J[0][J[0].length-1].to):'UTC');
  var H=(T.hotels||[]).slice().sort(function(a,b){return String(a.checkin).localeCompare(String(b.checkin))});
  var TR=T.transfers||[];
  var E=[], pre=[];
  function add(t,z,title,text,imp,url){if(!isNaN(t))E.push({t:t,tz:z,title:title,text:text,imp:!!imp,url:url})}

  (T.entry||[]).forEach(function(e){pre.push({title:e.title,text:e.text+(e.opens?' Si compila da '+dayLong(z2e(e.opens,dtz),dtz)+'.':''),imp:true,url:safeUrl(e.url)})});
  pre.push({title:'Check-in online',text:'Di solito si apre 24–48 ore prima del volo: fallo nell\'app della compagnia e salva le carte d\'imbarco.'});
  pre.push({title:'Valigia',text:'Passaporto, un po\' di contanti, carta per il bancomat, caricabatterie e adattatore per le prese.'});
  pre.push({title:'Telefono',text:'SIM o eSIM del posto, app dei taxi installate e registrate, questa app nella schermata Home.'});
  pre.push({title:'Assicurazione',text:'Assicurazione sanitaria di viaggio fatta (o verificata quella della carta di credito). Salva il numero di assistenza nel telefono.',imp:true});
  pre.push({title:'Passaporto',text:'Controlla la scadenza: molti paesi vogliono almeno 6 mesi di validità. Foto del passaporto nel telefono e in un\'email a te stesso.'});
  pre.push({title:'Bagaglio',text:'Controlla nella prenotazione quanti chili di valigia da stiva hai. Se manca, compralo online: al banco costa di più. Power bank solo nel bagaglio a mano.'});
  pre.push({title:'Senza rete',text:'Scarica le mappe offline delle città in Google Maps e la lingua del posto in Google Traduttore.'});
  pre.push({title:'Soldi',text:'Carta senza commissioni all\'estero (Revolut, Wise o simili). Se serve, avvisa la banca del viaggio.'});
  (T.checks||[]).forEach(function(c){if(c&&c.title)pre.push({title:c.title,text:c.text,imp:!!c.imp})});

  var outArr=null;
  J.forEach(function(j,ji){
    var a=j[0], z=j[j.length-1], out=(a.leg!=='ritorno');
    var fin=city(z.to);
    if(out&&ji===0){
      var hm0=+T.home_to_airport_minutes||90;
      add(a.depT-(180+hm0)*MIN,tz(a.from),'Parti per l\'aeroporto di '+city(a.from),'Calcolato con circa '+dur(hm0)+' tra strada e margine per il traffico.');
    }
    add(a.depT-180*MIN,tz(a.from),'Al banco '+(a.airline||'della compagnia')+': consegna la valigia',
      j.length>1?'Chiedi che la valigia arrivi direttamente a '+fin+' e fatti dare le carte d\'imbarco di tutti i voli.':'Poi controllo passaporti e sicurezza, e al gate.',true);
    j.forEach(function(f,k){
      if(k>0){
        var p=j[k-1],g=(f.depT-p.arrT)/MIN,short=g<120;
        add(p.arrT,tz(p.to),'Scalo a '+city(p.to)+': '+dur(g),
          short?'Scalo breve: non uscire. Segui subito i cartelli Transfer e vai al gate del volo '+f.number+'.':'Resta nell\'area transiti e segui i cartelli Transfer.',short);
      }
      add(f.depT,tz(f.from),'Volo '+f.number+' '+city(f.from)+' → '+city(f.to),'Arrivo alle '+hm(f.arrT,tz(f.to))+' ora locale.');
    });
    add(z.arrT,tz(z.to),'Atterraggio a '+fin,out?'Poi immigrazione, bagagli e trasporto: i passi sono nella scheda Voli e hotel.':'Bentornato! Ritiro valigia e rientro a casa.');
    if(out&&!outArr)outArr=z;
  });

  var retJ=J.filter(function(j){return j[0].leg==='ritorno'});
  var prevEnd=null;
  H.forEach(function(h,i){
    var ci=z2e(h.checkin+'T'+(h.checkin_time||'14:00'),dtz), co=z2e(h.checkout+'T'+(h.checkout_time||'12:00'),dtz);
    var tIn=TR[i]||{};
    if(i===0&&outArr){
      var go=outArr.arrT+60*MIN;
      add(go,dtz,'Verso '+h.name,[tIn.how,tIn.price?'Circa '+tIn.price+'.':'',tIn.minutes?'Ci vogliono circa '+dur(tIn.minutes)+'.':''].join(' ').trim(),true);
      ci=Math.max(ci,go+(+tIn.minutes||60)*MIN);
    }else if(prevEnd){ci=Math.max(ci,prevEnd)}
    add(ci,dtz,'Check-in: '+h.name,'Check-in dalle '+(h.checkin_time||'14:00')+'. '+(h.notes||''));
    if(i<H.length-1){
      var tn=TR[i+1]||{};
      add(co,dtz,'Check-out da '+h.name,'Entro le '+(h.checkout_time||'12:00')+'.');
      add(co+MIN,dtz,'Verso '+H[i+1].name,[tn.how,tn.price?'Circa '+tn.price+'.':'',tn.minutes?'Ci vogliono circa '+dur(tn.minutes)+'.':''].join(' ').trim());
      prevEnd=co+(+tn.minutes||120)*MIN;
    }else{
      var rj=null;retJ.forEach(function(j){if(!rj&&j[0].depT>co-24*36e5)rj=j});
      if(!rj){add(co,dtz,'Check-out da '+h.name,'Entro le '+(h.checkout_time||'12:00')+'.');return}
      var r=rj[0],tr=TR[i+1]||{},m=+tr.minutes||90,leave=r.depT-(180+m)*MIN;
      var eve=z2e(ymd(r.depT-864e5,dtz)+'T20:00',dtz);
      add(eve,dtz,'Valigia e check-in online','Prepara la valigia e fai il check-in online del volo '+r.number+'. Tieni da parte i contanti per il trasferimento.');
      add(Math.min(co,leave-15*MIN),dtz,'Check-out da '+h.name,'Entro le '+(h.checkout_time||'12:00')+'.');
      add(leave,dtz,'Parti per l\'aeroporto di '+city(r.from),[tr.how,tr.price?'Circa '+tr.price+'.':'','Ci vogliono circa '+dur(m)+'.'].join(' ').trim(),true);
    }
  });
  E.sort(function(a,b){return a.t-b.t});
  E.forEach(function(e,i){e.k=T.id+'-e-'+e.title+'-'+e.t});
  pre.forEach(function(e,i){e.k=T.id+'-p-'+i});
  return {E:E,pre:pre,J:J,F:F,H:H,dtz:dtz,tz:tz,city:city,outArr:outArr};
}

function db(){return new Promise(function(ok,ko){var r=indexedDB.open('viaggio-docs',1);r.onupgradeneeded=function(){r.result.createObjectStore('docs')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){ko(r.error)}})}

function docPut(k,v){return dbDo('readwrite',function(s){return s.put(v,k)})}

function callGemini(key,parts,model,search){
  var body={contents:[{role:'user',parts:parts}],generationConfig:{temperature:0.2}};
  if(search)body.tools=[{google_search:{}}];else body.generationConfig.responseMimeType='application/json';
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},150000);
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',signal:ctl.signal,
    headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){clearTimeout(to);return{ok:r.ok,status:r.status,d:d}})});
}
function parseJson(d){
  var c=d&&d.candidates&&d.candidates[0],t=((c&&c.content&&c.content.parts)||[]).map(function(p){return p.text||''}).join('');
  var a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)return null;
  try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}
}
function ask(input,att,keepId){
  var key=load('gkey','');
  if(!key){err('Prima incolla la chiave Gemini in I miei viaggi (in fondo alla pagina).');return}
  if(!navigator.onLine){err('Serve internet per preparare il viaggio.');return}
  if(busy)return;busy=true;
  var st=document.getElementById('st');st.className='status';st.innerHTML='<span class="spin"></span>Sto preparando il viaggio: cerco regole d\'ingresso, trasferimenti e indirizzi. Ci vuole circa un minuto…';
  document.querySelectorAll('#go,#ok,#refix').forEach(function(b){b.disabled=true});
  var parts=[{text:PROMPT+'\n\n'+input}];(att||[]).forEach(function(f){parts.push({inline_data:{mime_type:f.mime,data:f.data}})});
  var i=0;
  function attempt(search){
    var m=MODELS[i];
    return callGemini(key,parts,m,search).then(function(r){
      if(r.status===404&&i<MODELS.length-1){i++;return attempt(search)}
      if(!r.ok){var msg=(r.d&&r.d.error&&r.d.error.message)||('errore '+r.status);
        if(r.status===400&&/API key/i.test(msg))throw new Error('La chiave Gemini non è valida. Controllala in I miei viaggi.');
        if(r.status===429)throw new Error('Gemini è occupato o hai finito la quota gratuita. Riprova tra un minuto.');
        if(search)return attempt(false);
        throw new Error('Gemini non ha risposto: '+msg)}
      var j=parseJson(r.d);
      if(!j&&search)return attempt(false);
      if(!j)throw new Error('Gemini ha risposto in modo confuso. Riprova.');
      return j;
    });
  }
  attempt(true).then(function(j){
    busy=false;
    j.id=keepId||('t'+Date.now());
    ['flights','hotels','transfers','entry','arrival_steps','departure_steps','emergency','phrases','tips','checks','missing'].forEach(function(k){if(!Array.isArray(j[k]))j[k]=[]});
    j.airports=j.airports||{};j.missing=j.missing.filter(Boolean);j.tips=j.tips.filter(Boolean);
    j.entry=j.entry.filter(function(e){return e&&e.title});
    if(!j.flights.length&&!j.hotels.length)throw new Error('Non ho trovato né voli né hotel. Controlla il testo o le foto.');
    draft=j;step='review';render();window.scrollTo(0,0);
  }).catch(function(e){
    busy=false;document.querySelectorAll('#go,#ok,#refix').forEach(function(b){b.disabled=false});
    err(e.name==='AbortError'?'Ci sta mettendo troppo. Riprova.':(e.message||'Qualcosa è andato storto. Riprova.'));
  });
}
